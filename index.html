<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rental Car</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="search-box">

            <h2>Search for a rental car</h2>


            <label>Pick up location</label>

            <input
                type="text"
                class="form-control location-input"
                placeholder="City, airport, region, district..."
            >


            <div class="check-row">

                <input type="checkbox">

                <span>Deliver the car somewhere else</span>

            </div>


            <div class="row">

                <div class="col-6">

                    <label>Date of pickup</label>

                    <input
                        type="date"
                        class="form-control date-input"
                    >


                    <div class="row time-row">

                        <div class="col-6">

                            <select class="form-select time-select">

                                <option>10</option>
                                <option>09</option>
                                <option>11</option>
                                <option>12</option>

                            </select>

                        </div>


                        <div class="col-6">

                            <select class="form-select time-select">

                                <option>00</option>
                                <option>15</option>
                                <option>30</option>
                                <option>45</option>

                            </select>

                        </div>

                    </div>

                </div>


                <div class="col-6">

                    <label>Date of delivery</label>

                    <input
                        type="date"
                        class="form-control date-input"
                    >


                    <div class="row time-row">

                        <div class="col-6">

                            <select class="form-select time-select">

                                <option>10</option>
                                <option>09</option>
                                <option>11</option>
                                <option>12</option>

                            </select>

                        </div>


                        <div class="col-6">

                            <select class="form-select time-select">

                                <option>00</option>
                                <option>15</option>
                                <option>30</option>
                                <option>45</option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>


            <div class="driver-age">

                <input type="checkbox" checked>

                <span>
                    The driver's age between 30 and 65?
                </span>

                <span class="info-icon">i</span>

            </div>


            <div class="features">

                <div>
                    <span class="check-icon">✓</span>
                    No credit card fees
                </div>

                <div>
                    <span class="check-icon">✓</span>
                    No change fees
                </div>

                <div>
                    <span class="check-icon">✓</span>
                    Price match guarantee
                </div>

            </div>


            <button class="search-button">
                Search
            </button>

        </div>

    </div>

</body>
</html>
